<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick RSS</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- COLUMN 1: Sidebar -->
    <div class="sidebar">
      <!-- Native Window Drag Header Area -->
      <div class="sidebar-header">
        <div class="header-title">Quick RSS</div>
        <div class="header-actions">
          <button id="add-folder-btn" class="icon-action-btn" title="New Folder">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor">
              <path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h3.172a1.5 1.5 0 0 1 1.06.44l1.328 1.328a.5.5 0 0 0 .354.146H12.5A1.5 1.5 0 0 1 14 6.414V12.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 12.5v-8z"/>
              <path d="M8 7v4M6 9h4" stroke="currentColor" stroke-width="1.5"/>
            </svg>
          </button>
          <button id="expand-all-btn" class="icon-action-btn" title="Expand/Collapse Tree">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor">
              <path d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8zm11-1L8 11 4 7h8z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Scrollable Sidebar Tree Area -->
      <div class="sidebar-scroll-area">
        <!-- Section: Filters -->
        <div class="section-title">Filters</div>
        <ul class="nav-list">
          <li class="nav-item filter-item active" data-filter="all" id="filter-all">
            <div class="item-left">
              <span class="icon-box green-icon">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                  <path d="M8 1.5L1.5 5 8 8.5 14.5 5 8 1.5zM1.5 7.5L8 11l6.5-3.5M1.5 10L8 13.5l6.5-3.5"/>
                </svg>
              </span>
              <span class="item-label">All Articles</span>
            </div>
            <span class="item-badge" id="badge-all">0</span>
          </li>
          <li class="nav-item filter-item" data-filter="read" id="filter-read">
            <div class="item-left">
              <span class="icon-box green-icon">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                  <path d="M2.5 3.5h11a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1zm0 2v6h11v-6h-11z"/>
                </svg>
              </span>
              <span class="item-label">Read Articles</span>
            </div>
          </li>
          <li class="nav-item filter-item" data-filter="latest" id="filter-latest">
            <div class="item-left">
              <span class="icon-box green-icon">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                  <path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM8 3v5l3.5 2"/>
                </svg>
              </span>
              <span class="item-label">Latest News</span>
            </div>
            <span class="item-badge" id="badge-latest">0</span>
          </li>
        </ul>

        <!-- Section: iCloud Drag-and-Drop Folders Tree -->
        <div class="section-title">
          <span>iCloud</span>
          <span class="sub-hint">Drag & drop to nest/reorder</span>
        </div>
        <div id="tree-container" class="tree-container">
          <!-- Dynamic Folders Tree -->
        </div>
      </div>
    </div>

    <!-- COLUMN 2: Article List -->
    <div class="article-list-column">
      <div class="article-list-header">
        <div class="search-bar-wrapper">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M7 13A6 6 0 1 0 7 1a6 6 0 0 0 0 12zM12 12l3 3"/>
          </svg>
          <input type="text" id="search-input" placeholder="Search articles...">
        </div>
      </div>
      <div class="article-list-content" id="article-list-container">
        <!-- Articles List Items -->
      </div>
    </div>

    <!-- COLUMN 3: Article Reader Pane -->
    <div class="reader-column">
      <div class="reader-header">
        <div class="reader-actions">
          <button id="star-btn" class="btn-icon" title="Star Article">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25z"/>
            </svg>
          </button>
          <button id="open-browser-btn" class="btn-icon" title="Open in Browser">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M8.636 3.5a.5.5 0 0 0-.5-.5H1.5A1.5 1.5 0 0 0 0 4.5v10A1.5 1.5 0 0 0 1.5 16h10a1.5 1.5 0 0 0 1.5-1.5V7.864a.5.5 0 0 0-1 0V14.5a.5.5 0 0 1-.5.5h-10a.5.5 0 0 1-.5-.5v-10a.5.5 0 0 1 .5-.5h6.636a.5.5 0 0 0 .5-.5z"/>
              <path d="M16 .5a.5.5 0 0 0-.5-.5h-5a.5.5 0 0 0 0 1h3.793L6.146 9.146a.5.5 0 1 0 .708.708L15 1.707V5.5a.5.5 0 0 0 1 0v-5z"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="reader-content" id="reader-container">
        <div class="empty-state">
          <div class="empty-icon">📰</div>
          <h3>Select an Article</h3>
          <p>Choose an article from the list to read its content.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Context Menu -->
  <div id="context-menu" class="context-menu hidden">
    <button class="ctx-item" id="ctx-new-subfolder">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 4v8M4 8h8"/></svg>
      New Subfolder
    </button>
    <button class="ctx-item" id="ctx-rename">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M12.854 2.146a.5.5 0 0 0-.707 0L3.5 10.793V13h2.207l8.647-8.646a.5.5 0 0 0 0-.708l-1.5-1.5z"/></svg>
      Rename
    </button>
    <div class="ctx-divider"></div>
    <button class="ctx-item danger" id="ctx-delete">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/><path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1h2.5a1 1 0 0 1 1 1v1zM4.118 4L4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/></svg>
      Delete Folder
    </button>
  </div>

  <script src="app.js"></script>
</body>
</html>
